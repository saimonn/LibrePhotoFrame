name: Build APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify (analyze + test)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
            flutter-version: '3.41.6'
            channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  device-test:
    name: Device test (emulator)
    needs: build
    # On demand only: booting an emulator adds minutes to the run and its
    # flakiness must not hold back a build.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          name: LibrePhotoFrame-apks-${{ github.sha }}
          path: apks

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create the emulator image
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "system-images;android-34;google_apis;x86_64"
          echo no | avdmanager create avd -n lpf -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force

      - name: Start the emulator
        run: |
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/emulator/emulator" -avd lpf -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -wipe-data &
          adb wait-for-device
          adb shell 'while [[ -z "$(getprop sys.boot_completed)" ]]; do sleep 2; done'
          adb root
          adb wait-for-device

      - name: Install the APK and measure the settings rows
        run: |
          adb install -r apks/*x86_64.apk
          tool/device_test.sh io.github.saimonn.librephotoframe

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn

  build:
    needs: verify
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit count

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
            flutter-version: '3.41.6'
            channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Setup signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          APK_SIGNING_CERTIFICATE: ${{ vars.APK_SIGNING_CERTIFICATE }}
        run: |
          if [[ -z "$APK_SIGNING_KEY" || -z "$APK_SIGNING_CERTIFICATE" ]]; then
            echo "::warning::APK_SIGNING_KEY / APK_SIGNING_CERTIFICATE are not configured. Falling back to a throwaway self-signed keystore - this APK cannot update an officially signed installation."
            keytool -genkeypair -v \
              -keystore /tmp/keystore.p12 \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=LibrePhotoFrame Dev Build, OU=Dev, O=LibrePhotoFrame, C=DE" 2>/dev/null
          else
            # Write the private key and certificate
            echo "$APK_SIGNING_KEY" > /tmp/signing-key.pem
            echo "$APK_SIGNING_CERTIFICATE" > /tmp/signing-cert.pem

            # Create PKCS12 keystore
            openssl pkcs12 -export -inkey /tmp/signing-key.pem -in /tmp/signing-cert.pem \
              -out /tmp/keystore.p12 -name "release" -passout pass:android
          fi

          # Create key.properties for Gradle
          cat > android/key.properties << EOF
          storePassword=android
          keyPassword=android
          keyAlias=release
          storeFile=/tmp/keystore.p12
          EOF

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Build Debug APK (dev builds only)
        if: github.ref == 'refs/heads/master'
        run: flutter build apk --debug

      - name: Rename APKs
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          APK_DIR="build/app/outputs/flutter-apk"
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag build: use clean version
            for abi in arm64-v8a armeabi-v7a x86_64; do
              if [[ -f "${APK_DIR}/app-${abi}-release.apk" ]]; then
                mv "${APK_DIR}/app-${abi}-release.apk" "${APK_DIR}/LibrePhotoFrame-${VERSION}-${abi}.apk"
              fi
            done
            echo "APK_PATTERN=LibrePhotoFrame-${VERSION}-*.apk" >> $GITHUB_ENV
          else
            # Branch build: add -dev and commit count
            COMMIT_COUNT=$(printf "%04d" $(git rev-list --count HEAD))
            for abi in arm64-v8a armeabi-v7a x86_64; do
              if [[ -f "${APK_DIR}/app-${abi}-release.apk" ]]; then
                mv "${APK_DIR}/app-${abi}-release.apk" "${APK_DIR}/LibrePhotoFrame-${VERSION}-dev-${COMMIT_COUNT}-${abi}.apk"
              fi
            done
            # Rename debug APK
            if [[ -f "${APK_DIR}/app-debug.apk" ]]; then
              mv "${APK_DIR}/app-debug.apk" "${APK_DIR}/LibrePhotoFrame-${VERSION}-dev-${COMMIT_COUNT}-debug.apk"
            fi
            echo "APK_PATTERN=LibrePhotoFrame-${VERSION}-dev-${COMMIT_COUNT}-*.apk" >> $GITHUB_ENV
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "APK_DIR=${APK_DIR}" >> $GITHUB_ENV

      - name: Upload APKs (non-tag branch builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/master' }}
        uses: actions/upload-artifact@v4
        with:
          name: LibrePhotoFrame-apks-${{ github.sha }}
          path: build/app/outputs/flutter-apk/LibrePhotoFrame-*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/LibrePhotoFrame-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete dev-latest release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'dev-latest'
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/dev-latest'
              });
              console.log('Deleted dev-latest release and tag');
            } catch (e) {
              console.log('No dev-latest release to delete');
            }

      - name: Update dev-latest pre-release (on master push)
        if: github.ref == 'refs/heads/master'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const apkDir = process.env.APK_DIR;
            const apkPattern = process.env.APK_PATTERN;
            
            // Find all APK files matching the pattern
            const allFiles = fs.readdirSync(apkDir);
            const apkFiles = allFiles.filter(f => f.startsWith('LibrePhotoFrame-') && f.endsWith('.apk'));
            
            // Try to get existing release
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'dev-latest'
              });
              
              // Delete existing assets
              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
              
              // Update release body
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                body: `Latest development build from master branch.\n\nCommit: ${context.sha}\nBuilt: ${new Date().toISOString()}\n\n⚠️ This is an unstable development build. Use at your own risk.`
              });
              
              release = release.data;
            } catch (e) {
              // Create new release
              const newRelease = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: 'dev-latest',
                target_commitish: context.sha,
                name: 'Development Build (Latest)',
                body: `Latest development build from master branch.\n\nCommit: ${context.sha}\nBuilt: ${new Date().toISOString()}\n\n⚠️ This is an unstable development build. Use at your own risk.`,
                prerelease: true
              });
              release = newRelease.data;
            }
            
            // Upload all APK files
            for (const apkName of apkFiles) {
              const apkPath = path.join(apkDir, apkName);
              const content = fs.readFileSync(apkPath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: apkName,
                data: content
              });
              console.log(`Uploaded ${apkName}`);
            }
